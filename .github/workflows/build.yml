name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Windows: the rigs are Windows and the launcher reads the registry
    # (golang.org/x/sys/windows/registry), which does not build on Linux.
    # Every run on ubuntu failed from e1de067 (2026-10-15) on.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...
