# vsfg7-atc - King Hussein Tower (OJMF) - Syria / Eastern Med
# Foothold VM: 192.168.1.222
#
# Tower frequency is the ratified vSFG-7 "Hornet Radio Presets - Eastern Med" card.
# Called KING HUSSEIN AC on the card, OJMF Mafraq AB on the chart.
# DCS terrain tower is 250.40; the card says 250.450.

airfield: OJMF
callsign: "King Hussein Tower"
freq_mhz: 250.450

# NOTE: 5002, not the 5008 the Training rig and the PG configs use.
srs_addr: "localhost:5002"
grpc_addr: "localhost:50051"

log_level: info
weather_interval_sec: 30
stale_threshold_min: 10
pattern_alt_ft: 1500
