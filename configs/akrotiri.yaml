# vsfg7-atc - Akrotiri Tower (LCRA) - Syria / Eastern Med
# Foothold VM: 192.168.1.222
#
# Tower frequency is the ratified vSFG-7 "Hornet Radio Presets - Eastern Med" card.
# DCS terrain tower is 251.70; the card says 252.000.
# Runway is 10/28 per the surveyed chart, NOT 11 as the ILS localizer bearing suggests.

airfield: LCRA
callsign: "Akrotiri Tower"
freq_mhz: 252.000

# NOTE: 5002, not the 5008 the Training rig and the PG configs use.
srs_addr: "localhost:5002"
grpc_addr: "localhost:50051"

log_level: info
weather_interval_sec: 30
stale_threshold_min: 10
pattern_alt_ft: 1500
