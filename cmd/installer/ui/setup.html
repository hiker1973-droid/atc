<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Readback ATC Setup</title>
<link rel="icon" href="/icon.png">
<style>
  :root {
    --bg: #1b1d21; /* the banner's own background, so it has no edge */ --panel: #25282d; --panel-2: #2d3036; --border: #3a3e45;
    --text: #eef0f2; --muted: #a3a9b2; --orange: #ff6a2b; --orange-2: #ff8a55;
    --green: #3fb950; --amber: #e3a008; --red: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
         display: flex; flex-direction: column; user-select: none; overflow: hidden; }
  .top { text-align: center; padding: 14px 0 4px; }
  .top img { width: 380px; max-width: 80%; }
  main { flex: 1; padding: 0 40px; overflow-y: auto; }
  h1 { font-size: 21px; font-weight: 600; margin: 6px 0 6px; }
  p { margin: 6px 0; color: var(--muted); }
  .ver { color: var(--orange); }
  .folder { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin: 16px 0 12px;
            font-size: 12.5px; color: var(--muted); }
  .folder b { display: block; color: var(--text); font-weight: 500; font-size: 13.5px; word-break: break-all; }
  label.opt { display: flex; gap: 10px; align-items: center; padding: 6px 2px; cursor: pointer; }
  label.opt input { width: 17px; height: 17px; accent-color: var(--orange); }
  footer { display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding: 14px 40px 18px;
           border-top: 1px solid var(--border); background: var(--panel); }
  footer .left { margin-right: auto; color: var(--muted); font-size: 12px; }
  button { font: inherit; font-weight: 600; border-radius: 7px; padding: 8px 22px; cursor: pointer; border: 1px solid var(--border);
           background: var(--panel-2); color: var(--text); }
  button:hover { border-color: #5a606a; }
  button.primary { background: var(--orange); border-color: var(--orange); color: #1b1b1b; }
  button.primary:hover { background: var(--orange-2); }
  button.small { padding: 4px 12px; font-size: 12.5px; }
  button:disabled { opacity: 0.5; cursor: default; }
  a { color: var(--orange-2); cursor: pointer; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin: 18px 0 14px; }
  .bar i { display: block; height: 100%; width: 35%; background: var(--orange); border-radius: 3px; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
  .log { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 12.5px;
         color: var(--muted); max-height: 190px; overflow-y: auto; user-select: text; }
  .log div::before { content: "✓  "; color: var(--green); }
  .ok-big { display: inline-flex; width: 30px; height: 30px; border-radius: 50%; background: var(--green); color: #0d1117;
            align-items: center; justify-content: center; font-weight: 800; margin-right: 10px; vertical-align: -6px; }
  .reqs { margin: 12px 0; display: grid; gap: 8px; }
  .req { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; background: var(--panel);
         border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; }
  .req .ic { font-weight: 800; text-align: center; }
  .req .ic.ok { color: var(--green); } .req .ic.no { color: var(--amber); }
  .req b { font-weight: 600; }
  .req small { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .req small.err { color: var(--red); }
  .spin { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--orange); border-radius: 50%;
          animation: spin 0.8s linear infinite; display: inline-block; vertical-align: -3px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: var(--red); background: rgba(248, 81, 73, 0.08); border: 1px solid rgba(248, 81, 73, 0.4); border-radius: 8px;
           padding: 10px 14px; margin: 12px 0; user-select: text; }
</style>
</head>
<body>
<div class="top"><img src="/banner.png" alt="Readback - AI ATC for DCS"></div>
<main id="main"></main>
<footer id="foot"></footer>
<script>
const token = new URLSearchParams(location.search).get('t');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let st = null, shown = '', startup = null, launch = true;

async function call(path, body) {
  const r = await fetch('/api/' + path, {
    method: body ? 'POST' : 'GET', headers: { 'X-Token': token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  st = await r.json();
  if (path === 'finish' || path === 'quit') { window.close(); return; } // setup is ending: the window goes too
  render();
}

function logHTML() {
  return `<div class="log" id="log">${(st.log || []).filter(l => !/^(Readback ATC setup|Setup window)/.test(l)).map(l => `<div>${esc(l)}</div>`).join('')}</div>`;
}

function render() {
  const key = st.mode + st.phase + (st.phase === 'done' || st.phase === 'working' || st.phase === 'removed'
    ? JSON.stringify([st.log.length, st.busy, st.busyErr, (st.prereqs || []).map(p => p.ok)]) : '');
  if (key === shown) return;
  shown = key;
  if (startup === null) startup = !!st.startup;
  const main = $('main'), foot = $('foot');
  const v = esc(st.version || 'dev');

  if (st.mode === 'uninstall' && st.phase === 'welcome') {
    main.innerHTML = `<h1>Remove Readback ATC?</h1>
      <p>This removes the programs and their shortcuts from this PC.</p>
      <div class="folder">Installed in<b>${esc(st.dir)}</b></div>
      <p>Your settings, squadron logo, start files and logs stay in that folder, so a later install picks them up.
         Delete the folder yourself to remove them too.</p>`;
    foot.innerHTML = `<button onclick="call('quit',{})">Cancel</button><button class="primary" onclick="call('uninstall',{})">Remove</button>`;
  } else if (st.phase === 'welcome') {
    const update = st.installed && st.installed !== st.version, again = st.installed && st.installed === st.version;
    main.innerHTML = `<h1>${update ? `Update Readback ATC to <span class="ver">${v}</span>` : again ? `Reinstall Readback ATC <span class="ver">${v}</span>` : `Install Readback ATC <span class="ver">${v}</span>`}</h1>
      <p>${update ? `Version ${esc(st.installed)} is installed. Your settings, keys and squadron logo are kept.`
        : 'AI air traffic control for DCS World: towers, ATIS, Command, AWACS and the carrier, talking on your SRS server.'}</p>
      <div class="folder">Install folder<b>${esc(st.dir)}</b>No administrator rights needed.</div>
      <label class="opt"><input type="checkbox" id="startup" ${startup ? 'checked' : ''} onchange="startup=this.checked">
        Start Readback ATC when Windows starts</label>
      <p style="font-size:12.5px">Install Readback on the PC that runs your SRS server.</p>`;
    foot.innerHTML = `<span class="left">Readback ATC ${v}</span><button onclick="call('quit',{})">Cancel</button>
      <button class="primary" onclick="call('install',{startup})">${update ? 'Update' : 'Install'}</button>`;
  } else if (st.phase === 'working') {
    main.innerHTML = `<h1>${st.mode === 'uninstall' ? 'Removing Readback ATC…' : 'Installing Readback ATC…'}</h1>
      <div class="bar"><i></i></div>${logHTML()}`;
    foot.innerHTML = `<span class="left">Please wait</span><button disabled>Next</button>`;
  } else if (st.phase === 'done') {
    const reqs = st.prereqs || [], missing = reqs.filter(r => !r.ok).length;
    main.innerHTML = `<h1><span class="ok-big">✓</span>Readback ATC is installed</h1>
      <p>${missing ? `Before your first session, this PC still needs ${missing === 1 ? 'one thing' : missing + ' things'}:` : 'This PC has everything Readback needs.'}</p>
      <div class="reqs">${reqs.map(reqHTML).join('')}</div>
      <label class="opt"><input type="checkbox" ${launch ? 'checked' : ''} onchange="launch=this.checked">
        Open Readback ATC and its Setup page now</label>`;
    foot.innerHTML = `<span class="left"><a onclick="call('open',{key:'folder'})">Open the install folder</a></span>
      <button class="primary" onclick="call('finish',{launch})" ${st.busy ? 'disabled' : ''}>Finish</button>`;
  } else if (st.phase === 'removed') {
    main.innerHTML = `<h1><span class="ok-big">✓</span>Readback ATC was removed</h1>${logHTML()}`;
    foot.innerHTML = `<button class="primary" onclick="call('quit',{})">Close</button>`;
  } else {
    main.innerHTML = `<h1>Setup could not finish</h1><div class="error">${esc(st.err)}</div>${logHTML()}
      <p>Close any Readback windows and try again. The full log is in %TEMP%\\Readback-Setup.log.</p>`;
    foot.innerHTML = `<button onclick="call('quit',{})">Close</button>
      <button class="primary" onclick="call('${st.mode === 'uninstall' ? 'uninstall' : 'install'}',{startup})">Try again</button>`;
  }
  const log = $('log');
  if (log) log.scrollTop = log.scrollHeight;
}

function reqHTML(r) {
  let action = '';
  if (!r.ok) {
    if (st.busy === r.key) action = `<span class="spin"></span>`;
    else if (r.winget) action = `<button class="small primary" onclick="call('${r.key}',{})" ${st.busy ? 'disabled' : ''}>Install</button>`;
    else action = `<button class="small" onclick="call('open',{key:'${r.key}'})">Download</button>`;
  }
  let note = esc(r.why);
  if (!r.ok && r.winget) note += st.busy === r.key ? ' Installing with winget…' : ' Installs with Windows’ winget, accepting its terms.';
  const err = st.busyErr && r.key === 'ffmpeg' && !r.ok ? `<small class="err">${esc(st.busyErr)}</small>` : '';
  return `<div class="req"><span class="ic ${r.ok ? 'ok' : 'no'}">${r.ok ? '✓' : '!'}</span>
    <div><b>${esc(r.name)}</b><small>${r.ok ? 'Found on this PC.' : note}</small>${err}</div><div>${action}</div></div>`;
}

async function poll() {
  try { await call('state'); } catch (e) { /* setup has closed */ }
  setTimeout(poll, 700);
}
poll();
</script>
</body>
</html>
