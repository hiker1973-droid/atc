<!DOCTYPE html>
<html lang="en">
<head>
<script src="/theme.js"></script><link rel="stylesheet" href="/theme.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vSFG-7 Pilots</title>
<style>
  :root { --bg:var(--hx-0d1117, #0d1117); --panel:var(--hx-161b22, #161b22); --panel-2:var(--hx-1c2330, #1c2330); --border:var(--hx-30363d, #30363d); --text:var(--hx-c9d1d9, #c9d1d9); --muted:var(--hx-8b949e, #8b949e);
    --green:#3fb950; --amber:#d29922; --red:#f85149; --blue:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-size: 14px; }
  header { display: flex; align-items: center; gap: 0.7rem; padding: 0.7rem 1.2rem; flex-wrap: wrap;
    border-bottom: 1px solid var(--border); background: var(--panel); }
  .patch { width: 34px; height: 34px; border-radius: 50%; flex: none;
    box-shadow: 0 0 0 1px var(--hx-30363d, #30363d), 0 0 8px rgba(88,166,255,0.22); }
  header .logo { font-weight: 800; color: var(--blue); }
  header .title { font-weight: 600; margin-right: 0.5rem; }
  .spacer { flex: 1; }
  header a { color: var(--muted); text-decoration: none; font-size: 0.82rem; border: 1px solid var(--border);
    padding: 0.28rem 0.6rem; border-radius: 5px; }
  header a:hover { color: var(--text); }
  button, input { background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 0.3rem 0.6rem; font-size: 0.85rem; }
  button { cursor: pointer; }
  button:hover { border-color: var(--blue); }
  button.on { background: var(--hx-1f6feb, #1f6feb); color: var(--hx-ffffff, #fff); border-color: var(--hx-1f6feb, #1f6feb); }
  main { padding: 1rem 1.2rem; max-width: 1500px; margin: 0 auto; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.7rem; margin-bottom: 0.9rem; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 0.8rem; }
  .tile .n { font-size: 1.5rem; font-weight: 700; color: var(--blue); }
  .tile .l { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .rigs { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.7rem; display: flex; gap: 1rem; flex-wrap: wrap; }
  .rigs .ok { color: var(--green); } .rigs .bad { color: var(--amber); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 0.42rem 0.6rem; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child, th.l, td.l { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em;
    cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--panel); }
  th:hover { color: var(--text); }
  th.sorted::after { content: " ▾"; } th.sorted.asc::after { content: " ▴"; }
  tbody tr { cursor: pointer; } tbody tr:hover { background: var(--panel-2); }
  tr.sel { background: var(--hx-1f2d44, #1f2d44) !important; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 0.4rem; }
  .muted { color: var(--muted); }
  .zero { color: var(--hx-484f58, #484f58); }
  #detail { margin-top: 0.9rem; display: none; }
  #detail h2 { margin: 0 0 0.2rem; font-size: 1.15rem; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin-top: 0.7rem; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .box { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 0.7rem 0.9rem; }
  .box h3 { margin: 0 0 0.5rem; font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .bar { display: grid; grid-template-columns: 9rem 1fr 3.5rem; gap: 0.5rem; align-items: center; font-size: 0.83rem; margin: 0.2rem 0; }
  .bar .b { height: 8px; background: var(--blue); border-radius: 4px; min-width: 2px; }
  .box table th { position: static; cursor: default; }
  .empty, .setup { padding: 1.2rem; color: var(--muted); }
  .setup code { color: var(--text); background: var(--bg); padding: 0.1rem 0.3rem; border-radius: 3px; }
  .setup pre { background: var(--bg); padding: 0.6rem; border-radius: 5px; color: var(--text); overflow-x: auto; }

 button.pen { padding: 0 0.35rem; font-size: 0.8rem; margin-left: 0.3rem; opacity: 0.55; }
 button.pen:hover { opacity: 1; }
 #ed { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 50; }
 #ed .dlg { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 1.1rem 1.3rem; width: min(420px, 92vw); }
 #ed h3 { margin: 0 0 0.2rem; font-size: 1.05rem; }
 #ed label { display: block; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 0.7rem 0 0.2rem; }
 #ed select, #ed input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 0.4rem 0.5rem; font-size: 0.95rem; }
 #ed .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
 #ed .prev { font-size: 1.25rem; font-weight: 700; margin: 0.9rem 0 0.1rem; color: var(--blue); }
 #ed .btns { display: flex; gap: 0.5rem; margin-top: 1rem; align-items: center; }
 #ed .err { color: var(--red); font-size: 0.82rem; min-height: 1.1em; margin-top: 0.4rem; }
</style>
</head>
<body>
<header>
  <img class="patch" src="/logo.png" alt="vSFG-7 squadron patch">
  <span class="logo">vSFG-7</span><span class="title">Pilots</span>
  <span id="ranges"></span>
  <input id="q" placeholder="Search pilot or callsign" oninput="render()">
  <span class="spacer"></span>
  <span class="muted" id="status">—</span>
  <a href="/fleet">Fleet</a><a href="/logs">Logs</a><a href="/">Dashboard</a>
</header>
<main>
  <div class="tiles" id="tiles"></div>
  <div class="rigs" id="rigs"></div>
  <div class="panel"><table>
    <thead><tr id="head"></tr></thead>
    <tbody id="body"><tr><td class="empty" colspan="14">Loading…</td></tr></tbody>
  </table></div>
  <div id="detail"></div>
</main>
<div id="ed" onclick="if(event.target===this)edClose()"><div class="dlg">
  <h3>Edit pilot name</h3>
  <div class="muted">DCS name: <span id="ed-dcs"></span></div>
  <div class="row">
    <div><label>Flight</label><select id="ed-flight" onchange="edPreview()"><option>Raider</option><option>Venom</option></select></div>
    <div><label>Number</label><input id="ed-num" placeholder="302 or 2-1" oninput="edPreview()"></div>
  </div>
  <label>Name / call sign handle</label><input id="ed-handle" placeholder="Jedi" oninput="edPreview()">
  <div class="prev" id="ed-prev"></div>
  <div class="err" id="ed-err"></div>
  <div class="btns"><button class="on" onclick="edSave(false)">Save</button><button onclick="edClose()">Cancel</button>
    <span class="spacer"></span><button onclick="edSave(true)" title="Drop your edit and use the tidied DCS name">Use automatic name</button></div>
</div></div>
<script>
// Data: DCSServerBot (slot time, kills, deaths, takeoffs, landings, traps)
// from every rig, merged by the launcher (cmd/launcher/pilots.go).
const RANGES = [[7, '7 days'], [30, '30 days'], [90, '90 days'], [0, 'All time']];
const COLS = [
  ['name', 'Pilot', 'l'], ['hours', 'Hours'], ['sessions', 'Slots'], ['sorties', 'Sorties'],
  ['landings', 'Landings'], ['traps', 'Traps'], ['trapPoints', 'Avg trap'], ['kills', 'Kills'],
  ['deaths', 'Deaths'], ['crashes', 'Crashes'], ['ejections', 'Ejects'], ['top', 'Main aircraft', 'l'],
  ['lastSeen', 'Last seen', 'l'],
];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let days = 30, data = null, sortKey = 'hours', asc = false, selected = null;
try { const d = parseInt(localStorage.getItem('pilotsDays')); if (!isNaN(d)) days = d; } catch {}

function topAircraft(p) {
  const e = Object.entries(p.aircraft || {}).sort((a, b) => b[1] - a[1]);
  return e.length ? e[0][0] : '';
}
function ago(t) {
  if (!t || t.startsWith('0001')) return '—';
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  return Math.round(s / 86400) + ' d ago';
}
const num = (v, d = 0) => v ? `<td>${Number(v).toFixed(d)}</td>` : `<td class="zero">0</td>`;
const when = t => (!t || t.startsWith('0001')) ? '—' : new Date(t).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});

function drawRanges() {
  $('ranges').innerHTML = RANGES.map(([d, l]) =>
    `<button class="${d === days ? 'on' : ''}" onclick="setDays(${d})">${l}</button>`).join(' ');
}
function setDays(d) { days = d; try { localStorage.setItem('pilotsDays', d); } catch {} drawRanges(); load(); }

async function load() {
  $('status').textContent = 'loading…';
  try {
    data = await fetch('/api/pilots?days=' + days, { cache: 'no-store' }).then(r => r.json());
    $('status').textContent = 'updated ' + new Date(data.at).toLocaleTimeString();
  } catch (e) {
    $('status').textContent = 'failed: ' + e;
    return;
  }
  render();
}

function render() {
  if (!data) return;
  const rigs = data.rigs || [];
  // A rig with no database link (the dev box) is neutral, not a fault.
  $('rigs').innerHTML = rigs.map(r => !r.configured
    ? `<span class="muted" title="${esc(r.err)}">○ ${esc(r.rig)}: no DCSServerBot link</span>`
    : r.err ? `<span class="bad">● ${esc(r.rig)}: ${esc(r.err)}</span>`
    : `<span class="ok">● ${esc(r.rig)}: DCSServerBot</span>`).join('');
  const pilots = (data.pilots || []).map(p => ({ ...p, top: topAircraft(p) }));
  const sum = k => pilots.reduce((a, p) => a + (p[k] || 0), 0);
  $('tiles').innerHTML = [
    [pilots.length, 'Pilots'], [sum('hours').toFixed(0), 'Hours in slot'], [sum('sorties'), 'Sorties'],
    [sum('landings'), 'Landings'], [sum('traps'), 'Carrier traps'], [sum('kills'), 'Kills'],
    [pilots.filter(p => p.online).length, 'Online now'],
  ].map(([n, l]) => `<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

  $('head').innerHTML = COLS.map(([k, l, cls]) =>
    `<th class="${cls || ''} ${k === sortKey ? 'sorted' + (asc ? ' asc' : '') : ''}" onclick="sortBy('${k}')">${l}</th>`).join('');

  if (!rigs.some(r => r.configured)) {
    $('body').innerHTML = `<tr><td colspan="${COLS.length}" class="setup">${setupHelp()}</td></tr>`;
    return;
  }
  const q = $('q').value.trim().toLowerCase();
  let rows = pilots.filter(p => !q || (p.name || '').toLowerCase().includes(q) || (p.callsign || '').toLowerCase().includes(q));
  rows.sort((a, b) => {
    let x = a[sortKey], y = b[sortKey];
    if (typeof x === 'string' || typeof y === 'string') { x = String(x || ''); y = String(y || ''); return asc ? x.localeCompare(y) : y.localeCompare(x); }
    return asc ? (x || 0) - (y || 0) : (y || 0) - (x || 0);
  });
  if (!rows.length) {
    $('body').innerHTML = `<tr><td colspan="${COLS.length}" class="empty">No pilots in this range.</td></tr>`;
  } else {
    $('body').innerHTML = rows.map(p => `<tr class="${p.ucid === selected ? 'sel' : ''}" onclick="pick('${esc(p.ucid)}')">
      <td>${p.online ? '<span class="dot" title="in a slot now"></span>' : ''}${esc(p.name)}${p.needsName ? ' <span style="color:var(--amber)" title="Not in Raider/Venom format - press the pencil to set it">⚠ needs callsign</span>' : ''} <button class="pen" title="Edit name" onclick="event.stopPropagation();editName('${esc(p.ucid)}')">✎</button></td>
      ${num(p.hours, 1)}${num(p.sessions)}${num(p.sorties)}${num(p.landings)}${num(p.traps)}${num(p.trapPoints, 1)}
      ${num(p.kills)}${num(p.deaths)}${num(p.crashes)}${num(p.ejections)}
      <td class="l">${esc(p.top)}</td><td class="l muted">${p.online ? 'now' : ago(p.lastSeen)}</td></tr>`).join('');
  }
  if (selected) detail(pilots.find(p => p.ucid === selected));
}

function sortBy(k) { if (sortKey === k) asc = !asc; else { sortKey = k; asc = k === 'name' || k === 'top'; } render(); }
function pick(ucid) { selected = selected === ucid ? null : ucid; render(); if (!selected) $('detail').style.display = 'none'; }

function bars(map) {
  const e = Object.entries(map || {}).sort((a, b) => b[1] - a[1]);
  const max = e.length ? e[0][1] : 1;
  return e.length ? e.map(([k, v]) => `<div class="bar"><span>${esc(k)}</span>
    <span><div class="b" style="width:${Math.max(1, 100 * v / max)}%"></div></span><span class="muted">${v.toFixed(1)} h</span></div>`).join('')
    : '<div class="muted">—</div>';
}

function detail(p) {
  const d = $('detail');
  if (!p) { d.style.display = 'none'; return; }
  d.style.display = 'block';
  const sessions = (p.recent || []).map(s => {
    const end = s.hopOff && !s.hopOff.startsWith('0001') ? new Date(s.hopOff) : null;
    const h = end ? ((end - new Date(s.hopOn)) / 3.6e6).toFixed(1) : 'now';
    return `<tr><td class="l">${when(s.hopOn)}</td><td class="l">${esc(s.server)}</td><td class="l">${esc(s.aircraft)}</td>
      <td>${h}</td><td>${s.takeoffs}</td><td>${s.landings}</td><td>${s.kills}</td><td>${s.deaths}</td></tr>`;
  }).join('');
  const traps = (p.recentTraps || []).map(t => `<tr><td class="l">${when(t.time)}</td><td class="l">${esc(t.aircraft)}</td>
    <td class="l">${esc(t.grade)}</td><td>${t.wire || '—'}</td><td>${t.points}</td><td class="l">${t.night ? 'night' : 'day'}</td></tr>`).join('');
  d.innerHTML = `<h2>${esc(p.name)} <button onclick="editName('${p.ucid}')" title="Rename this pilot everywhere (Pilots, Stats, reports)">Edit name</button></h2>
    ${p.rawName && p.rawName !== p.name ? `<div class="muted">DCS name: ${esc(p.rawName)}</div>` : ''}
    <div class="muted">${p.callsign ? esc(p.callsign) + ' · ' : ''}first seen ${when(p.firstSeen)} · last seen ${p.online ? 'now (in a slot)' : when(p.lastSeen)}
      · ${p.killsAir} air / ${p.killsGround} ground kills${p.teamkills ? ` · <span style="color:var(--red)">${p.teamkills} team kills</span>` : ''}</div>
    <div class="cols">
      <div class="box"><h3>Hours by aircraft</h3>${bars(p.aircraft)}</div>
      <div class="box"><h3>Hours by server</h3>${bars(p.servers)}</div>
    </div>
    <div class="cols">
      <div class="box"><h3>Recent slots</h3>${sessions ? `<table><thead><tr><th class="l">When</th><th class="l">Server</th><th class="l">Aircraft</th>
        <th>Hours</th><th>T/O</th><th>Land</th><th>Kills</th><th>Deaths</th></tr></thead><tbody>${sessions}</tbody></table>` : '<div class="muted">—</div>'}</div>
      <div class="box"><h3>Carrier traps (greenieboard)</h3>${traps ? `<table><thead><tr><th class="l">When</th><th class="l">Aircraft</th>
        <th class="l">Grade</th><th>Wire</th><th>Pts</th><th class="l"></th></tr></thead><tbody>${traps}</tbody></table>` : '<div class="muted">No graded traps in this range.</div>'}</div>
    </div>`;
}

let editUcid = null;
function editName(ucid) {
  const p = (data.pilots || []).find(x => x.ucid === ucid);
  if (!p) return;
  editUcid = ucid;
  const m = /^(Raider|Venom)\s+(\d[\d-]*)\s*\|\s*(.*)$/.exec(p.name || '');
  $('ed-flight').value = m ? m[1] : 'Venom';
  $('ed-num').value = m ? m[2] : '';
  $('ed-handle').value = m ? m[3] : '';
  $('ed-dcs').textContent = p.rawName || p.name || '';
  $('ed-err').textContent = '';
  edPreview();
  $('ed').style.display = 'flex';
  (m ? $('ed-handle') : $('ed-num')).focus();
}
function edName() {
  const n = $('ed-num').value.trim(), h = $('ed-handle').value.trim().replace(/\s+/g, ' ');
  return n && h ? `${$('ed-flight').value} ${n} | ${h}` : '';
}
function edPreview() { $('ed-prev').textContent = edName() || 'Raider 302 | Jedi'; $('ed-prev').style.opacity = edName() ? 1 : 0.4; }
function edClose() { $('ed').style.display = 'none'; editUcid = null; }
async function edSave(reset) {
  const name = reset ? '' : edName();
  if (!reset && !/^\d[\d-]*$/.test($('ed-num').value.trim())) { $('ed-err').textContent = 'Enter the number, e.g. 302 or 2-1.'; return; }
  if (!reset && !name) { $('ed-err').textContent = 'Fill in the number and the name.'; return; }
  const r = await fetch('/api/pilot-name', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ucid: editUcid, name }) });
  if (!r.ok) { $('ed-err').textContent = 'Could not save: ' + (await r.text()); return; }
  const u = editUcid;
  edClose();
  await load();
  const q = (data.pilots || []).find(x => x.ucid === u);
  if (q && selected === u) detail(q);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') edClose(); if (e.key === 'Enter' && editUcid && e.target.tagName === 'INPUT') edSave(false); });

function setupHelp() {
  return `<b>Connect DCSServerBot.</b> On each server, give the launcher the DCSServerBot database
  (a read-only user is enough), then press Update so the launcher picks it up:
  <pre>-- in psql, as the DCSServerBot database owner:
CREATE ROLE skyeye_read LOGIN PASSWORD 'pick-one';
GRANT CONNECT ON DATABASE dcsserverbot TO skyeye_read;
GRANT USAGE ON SCHEMA public TO skyeye_read;
GRANT SELECT ON ALL TABLES IN SCHEMA public TO skyeye_read;

:: then in a command prompt on the server:
setx SKYEYE_DCSSB_DB "postgres://skyeye_read:pick-one@127.0.0.1:5432/dcsserverbot"</pre>
  If the three servers share one DCSServerBot database, point all three at it; the page counts each slot once.`;
}

drawRanges();
load();
setInterval(load, 120000);
</script>
<script src="/branding.js"></script>
</body>
</html>
