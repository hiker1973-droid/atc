<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vSFG-7 Fleet Monitor</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #c9d1d9;
    --muted: #8b949e; --green: #3fb950; --amber: #d29922; --red: #f85149; --blue: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 1rem; padding: 0.9rem 1.4rem;
    border-bottom: 1px solid var(--border); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  .patch { width: 34px; height: 34px; border-radius: 50%; flex: none;
           box-shadow: 0 0 0 1px #30363d, 0 0 8px rgba(88,166,255,0.22); }
  header .logo { font-weight: 800; color: var(--blue); letter-spacing: 0.03em; }
  header .title { font-size: 1.05rem; font-weight: 600; }
  header .spacer { flex: 1; }
  header .updated { color: var(--muted); font-size: 0.8rem; }
  header a.back { color: var(--muted); text-decoration: none; font-size: 0.85rem; border: 1px solid var(--border);
    padding: 0.25rem 0.7rem; border-radius: 5px; }
  header a.back:hover { color: var(--text); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; padding: 1.2rem; }
  .rig { border: 1px solid var(--border); border-radius: 9px; background: var(--panel); overflow: hidden; }
  .rig-head { display: flex; align-items: center; gap: 0.6rem; padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); }
  .rig-name { font-size: 1.05rem; font-weight: 700; }
  .rig-host { color: var(--muted); font-size: 0.8rem; }
  .badge { margin-left: auto; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 0.2rem 0.6rem; border-radius: 20px; white-space: nowrap; }
  .badge.online { background: #23863633; color: var(--green); border: 1px solid #2386364d; }
  .badge.degraded { background: #9e6a0333; color: var(--amber); border: 1px solid #9e6a034d; }
  .badge.offline { background: #6e111133; color: var(--red); border: 1px solid #da36334d; }
  .ver { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.72rem; color: var(--muted);
    background: #ffffff0a; border: 1px solid var(--border); border-radius: 4px; padding: 0.05rem 0.35rem; }
  .ver.dirty { color: var(--amber); border-color: #9e6a034d; }
  .rig-body { padding: 0.8rem 1rem; }
  .dots { display: flex; gap: 1.1rem; margin-bottom: 0.7rem; flex-wrap: wrap; }
  .dot { display: flex; align-items: center; gap: 0.35rem; font-size: 0.82rem; color: var(--muted); }
  .dot i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--muted); }
  .dot.up i { background: var(--green); box-shadow: 0 0 6px #3fb95088; }
  .dot.down i { background: var(--red); }
  .roles-line { font-size: 0.9rem; margin-bottom: 0.5rem; }
  .roles-line b { color: var(--text); }
  .region { margin-top: 0.5rem; }
  .region-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.25rem; }
  .role-pill { display: inline-block; font-size: 0.75rem; background: #1f6feb22; color: var(--blue);
    border: 1px solid #1f6feb44; border-radius: 5px; padding: 0.1rem 0.45rem; margin: 0 0.3rem 0.3rem 0; }
  .empty { color: var(--muted); font-size: 0.85rem; font-style: italic; }
  .err { color: var(--red); font-size: 0.8rem; margin-top: 0.5rem; word-break: break-word; }
  .foot { color: var(--muted); font-size: 0.72rem; margin-top: 0.6rem; }
  .rig.hasalert { border-color: #da3633; box-shadow: 0 0 0 1px #da363355; }
  .alerts { margin-top: 0.7rem; border-top: 1px solid var(--border); padding-top: 0.6rem; }
  .alert { display: flex; gap: 0.4rem; align-items: baseline; font-size: 0.78rem; margin-bottom: 0.3rem; }
  .alert .lvl { font-weight: 700; text-transform: uppercase; font-size: 0.66rem; padding: 0.05rem 0.35rem; border-radius: 4px; white-space: nowrap; }
  .alert .lvl.error { background: #6e111133; color: var(--red); }
  .alert .lvl.warn { background: #9e6a0333; color: var(--amber); }
  .alert .src { color: var(--muted); }
  .alert .msg { color: var(--text); word-break: break-word; }
  .banner { display: none; margin: 0.9rem 1.2rem -0.4rem; padding: 0.6rem 1rem; border-radius: 8px;
    background: #6e111133; border: 1px solid #da363366; color: var(--red); font-weight: 600; font-size: 0.9rem; }
  .banner.show { display: block; }
  /* One-click update */
  .upd-btn { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 5px;
    padding: 0.2rem 0.6rem; font-size: 0.75rem; cursor: pointer; font-family: inherit; }
  .upd-btn:hover { border-color: var(--green); }
  .upd-btn:disabled { opacity: 0.5; cursor: default; }
  .upd { margin-top: 0.5rem; padding: 0.4rem 0.6rem; border-radius: 6px; font-size: 0.78rem; border: 1px solid var(--border); }
  .upd.run { border-color: #9e6a0399; color: var(--amber); }
  .upd.ok { border-color: #2386364d; color: var(--green); }
  /* Mission + DCS link + traffic */
  .mission { margin-bottom: 0.7rem; padding: 0.5rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; background: #ffffff05; }
  .mission.bad { border-color: #da363399; background: #6e111122; }
  .mission-name { font-size: 0.86rem; font-weight: 600; color: var(--text); word-break: break-word; }
  .mission-sub { font-size: 0.76rem; color: var(--muted); margin-top: 0.2rem; display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center; }
  .mismatch { color: var(--red); font-size: 0.78rem; font-weight: 600; margin-top: 0.3rem; }
  .traffic summary { cursor: pointer; font-size: 0.78rem; color: var(--muted); margin-top: 0.35rem; }
  .traffic table { width: 100%; border-collapse: collapse; font-size: 0.75rem; margin-top: 0.3rem; }
  .traffic td { padding: 0.1rem 0.3rem 0.1rem 0; white-space: nowrap; }
  .traffic td.alt { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .traffic td.ac { color: var(--muted); }
  .c-blue { color: var(--blue); } .c-red { color: var(--red); }
  .upd.fail { border-color: #da363366; color: var(--red); white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<header>
  <img class="patch" src="/logo.png" alt="vSFG-7 squadron patch">
  <span class="logo">vSFG-7</span>
  <span class="title">Fleet Monitor</span>
  <span class="spacer"></span>
  <span class="updated" id="updated">—</span>
  <button class="upd-btn" id="updAll" onclick="updateAll()" title="Update every online rig, one at a time">⟳ Update all rigs</button>
  <a class="back" href="/pilots">Pilots</a>
  <a class="back" href="/logs">Logs</a>
  <a class="back" href="/">← Dashboard</a>
</header>
<div class="banner" id="banner"></div>
<div class="grid" id="grid"></div>
<script>
const REGION_LABEL = { pg: 'Persian Gulf', caucasus: 'Caucasus', germany: 'Germany', iraq: 'Iraq', syria: 'Syria', kola: 'Kola' };

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function dot(label, up, title) {
  const cls = up === null ? '' : (up ? 'up' : 'down');
  return `<span class="dot ${cls}"${title ? ` title="${esc(title)}"` : ''}><i></i>${label}</span>`;
}

// SkyEye GCI has three states: running, installed but stopped, and not on this
// rig at all (grey — not every rig runs GCI). Launchers that predate the probe
// send no gci field, which also reads grey.
// Shown as AWACS (operator 2026-10-21); the API field stays "gci".
function gciDot(h) {
  if (h.gci === 'online') return dot('AWACS', true, `SkyEye AWACS running (PID ${h.gciPid})`);
  if (h.gci === 'offline') return dot('AWACS', false, 'SkyEye AWACS installed but not running');
  if (h.gci === 'absent') return dot('AWACS', null, 'SkyEye AWACS not installed on this rig');
  return dot('AWACS', null, 'unknown — launcher predates the AWACS probe, needs redeploy');
}

// Role names keep "GCI" (start bats, logs); the dashboard says AWACS.
function roleLabel(n) { return String(n).replace(/\bGCI\b/g, 'AWACS'); }

// What the rig's DCS server is flying: mission file, DCS link (this launcher's
// Tacview feed for the rig), traffic, and a red flag when the running roles are
// for another theatre.
function missionBlock(r) {
  const m = r.mission, a = r.air;
  if (!m && !a) return '';
  // A dead link only matters when ATC roles are up and talking to nobody.
  const live = (r.running || []).length > 0;
  const bad = !!(m && m.mismatch && m.mismatch.length) || !!(a && !a.connected && live);
  let h = `<div class="mission${bad ? ' bad' : ''}">`;
  if (m && m.name) {
    h += `<div class="mission-name" title="${esc(m.name)}: the mission the DCS server reports loaded">${esc(m.name.replace(/\.miz$/i, ''))}</div>`;
  } else if (m && m.err) {
    h += `<div class="empty" title="${esc(m.err)}">no mission reported</div>`;
  } else {
    h += `<div class="empty">mission unknown</div>`;
  }
  const sub = [];
  if (m && m.region) {
    const lbl = REGION_LABEL[m.region] || m.region;
    sub.push(m.regionGuessed ? `<span title="guessed from the file name: this rig's launcher does not report the theatre yet">${esc(lbl)}?</span>` : esc(lbl));
  }
  if (a) {
    const stale = a.connected && a.ageSec > 30;
    const title = a.connected ? (stale ? `no telemetry for ${Math.round(a.ageSec)} s: mission paused or ended?` : 'Tacview feed live') : (a.err || 'not connected');
    sub.push(dot('DCS', a.connected && !stale, title));
    if (a.connected) sub.push(`<span><b>${a.airborne}</b> airborne · ${a.onGround} on ground</span>`);
  }
  if (sub.length) h += `<div class="mission-sub">${sub.join('')}</div>`;
  if (a && !a.connected && a.err && live) h += `<div class="err" title="${esc(a.err)}">${esc(linkErr(a.err))}</div>`;
  if (m && m.mismatch && m.mismatch.length) {
    const roles = m.mismatch.map(x => REGION_LABEL[x] || x).join(', ');
    h += `<div class="mismatch">⚠ roles running for ${esc(roles)}, mission is ${esc(REGION_LABEL[m.region] || m.region)}</div>`;
  }
  if (a && a.contacts && a.contacts.length) {
    const rows = a.contacts.map(c => `<tr><td class="${c.color === 'Blue' ? 'c-blue' : c.color === 'Red' ? 'c-red' : ''}">${esc(c.callsign)}</td><td class="ac">${esc(c.aircraft)}</td><td class="alt">${c.altFt.toLocaleString()} ft</td></tr>`).join('');
    const key = 'traffic:' + r.name;
    h += `<details class="traffic" data-key="${esc(key)}"${OPEN[key] ? ' open' : ''} ontoggle="OPEN[this.dataset.key]=this.open"><summary>${a.blue} blue · ${a.red} red airborne</summary><table>${rows}</table></details>`;
  }
  return h + '</div>';
}
// Tacview's socket errors are long Windows strings; say what they mean.
function linkErr(e) {
  if (/actively refused/i.test(e)) return 'DCS not running or no mission loaded (Tacview port closed)';
  if (/timed? ?out|did not properly respond/i.test(e)) return 'no answer from the rig (Tacview timed out)';
  return e;
}
const OPEN = {}; // traffic lists the operator opened survive the 5 s refresh

function rigCard(r) {
  let badge, cls;
  if (r.launcherUp) { badge = 'Online'; cls = 'online'; }
  else if (r.hostUp) { badge = 'Launcher down'; cls = 'degraded'; }
  else { badge = 'Offline'; cls = 'offline'; }

  let body = '';
  if (r.launcherUp && r.health) {
    const h = r.health;
    body += `<div class="dots">
      ${dot('SRS', !!h.srs)}
      ${dot('Tacview', !!h.tacview)}
      ${dot('Viewer', !!h.tacview64)}
      ${dot('OpenAI', !!h.openai)}
      ${gciDot(h)}
    </div>`;
  }
  body += missionBlock(r);

  if (r.launcherUp) {
    const running = r.running || [];
    body += `<div class="roles-line"><b>${running.length}</b> running <span class="rig-host">/ ${r.rolesTotal||0} defined</span></div>`;
    if (running.length) {
      const byRegion = {};
      running.forEach(role => { (byRegion[role.region] = byRegion[role.region] || []).push(role); });
      Object.keys(byRegion).sort().forEach(reg => {
        const pills = byRegion[reg].map(role =>
          `<span class="role-pill">${esc(roleLabel(role.name))}${role.dashboardPort ? ' :'+role.dashboardPort : ''}</span>`).join('');
        body += `<div class="region"><div class="region-title">${REGION_LABEL[reg] || reg}</div>${pills}</div>`;
      });
    } else {
      body += `<div class="empty">no roles running</div>`;
    }
  } else {
    body += `<div class="empty">${r.hostUp ? 'host reachable, launcher not responding' : 'host unreachable'}</div>`;
    if (r.err) body += `<div class="err">${esc(r.err)}</div>`;
  }

  const alerts = r.alerts || [];
  if (alerts.length) {
    const rows = alerts.map(a => {
      const lvl = (a.level === 'error') ? 'error' : 'warn';
      return `<div class="alert"><span class="lvl ${lvl}">${lvl}</span><span class="src">${esc(a.source)}</span><span class="msg">${esc(a.message)}</span></div>`;
    }).join('');
    body += `<div class="alerts">${rows}</div>`;
  }

  const when = r.at ? new Date(r.at).toLocaleTimeString() : '';
  let verFoot = '';
  if (r.version && r.version.time) {
    verFoot = ` · built ${new Date(r.version.time).toLocaleString()}`;
  }
  const u = UPD[r.name];
  if (u) body += `<div class="upd ${u.cls}">${esc(u.text)}</div>`;
  body += `<div class="foot">polled ${when}${verFoot}</div>`;

  const alertCls = (r.alerts && r.alerts.length) ? ' hasalert' : '';
  let verChip = '';
  if (r.version && (r.version.version || r.version.short) && r.version.short !== 'unknown') {
    const label = r.version.version || r.version.short;
    const dirty = r.version.modified;
    verChip = `<span class="ver ${dirty ? 'dirty' : ''}" title="${esc(r.version.revision || '')}${dirty ? ' (built with local changes)' : ''}">${esc(label)}${dirty ? '*' : ''}</span>`;
  } else if (r.launcherUp) {
    verChip = `<span class="ver" title="launcher predates the /api/version endpoint — needs redeploy">no version</span>`;
  }
  return `<div class="rig${alertCls}">
    <div class="rig-head">
      <span class="rig-name" title="rig id: ${esc(r.name)}">${esc(r.label || r.name)}</span>
      <span class="rig-host">${esc(r.host)}:${r.port}</span>
      ${verChip}
      ${r.launcherUp ? `<button class="upd-btn" onclick="updateRig('${esc(r.name)}', ${r.self ? 'true' : 'false'})" ${UPD[r.name] && UPD[r.name].busy ? 'disabled' : ''} title="git pull, build, restart the running theatre, then the launcher">⟳ Update</button>` : ''}
      <span class="badge ${cls}">${badge}</span>
    </div>
    <div class="rig-body">${body}</div>
  </div>`;
}

async function refresh() {
  try {
    const res = await fetch('/api/fleet', { cache: 'no-store' });
    const rigs = await res.json();
    LAST_RIGS = rigs;
    document.getElementById('grid').innerHTML = rigs.map(rigCard).join('');
    // global alert banner
    let total = 0, offline = 0;
    let wrongMap = 0;
    rigs.forEach(r => {
      total += (r.alerts || []).length;
      if (!r.launcherUp && !r.hostUp) offline++;
      if (r.mission && r.mission.mismatch && r.mission.mismatch.length) wrongMap++;
    });
    const banner = document.getElementById('banner');
    const parts = [];
    if (total) parts.push(`${total} active fault${total === 1 ? '' : 's'} across the fleet`);
    if (wrongMap) parts.push(`${wrongMap} rig${wrongMap === 1 ? '' : 's'} running roles for the wrong theatre`);
    if (offline) parts.push(`${offline} rig${offline === 1 ? '' : 's'} offline`);
    if (parts.length) { banner.textContent = '⚠ ' + parts.join(' · '); banner.classList.add('show'); }
    else { banner.classList.remove('show'); }
    document.getElementById('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('updated').textContent = 'refresh failed: ' + e.message;
  }
}
// ── One-click update ─────────────────────────────────────────────────────────
// POST /api/update on the rig (through /rig/<name>/ unless it is this one),
// then follow GET /api/update until it finishes. The launcher restarts itself
// last, so the status calls fail for a few seconds; after that the rig's
// /api/version should name the commit it updated to.
const UPD = {};
let LAST_RIGS = [];
const rigApi = (name, self, path) => self ? path : '/rig/' + encodeURIComponent(name) + path;
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function updateRig(name, self, noConfirm) {
  if (!noConfirm && !confirm(`Update ${name}?

git pull, build, then restart the running theatre (about 30 s off the air) and the launcher.`)) return false;
  UPD[name] = { busy: true, cls: 'run', text: 'starting…' };
  refresh();
  try {
    const r = await fetch(rigApi(name, self, '/api/update'), { method: 'POST' });
    if (!r.ok) throw new Error(await r.text());
  } catch (e) {
    UPD[name] = { cls: 'fail', text: 'could not start: ' + e.message };
    refresh();
    return false;
  }
  let target = '', lastStep = '';
  for (let i = 0; i < 200; i++) {            // up to ~10 minutes
    await sleep(3000);
    try {
      const s = await fetch(rigApi(name, self, '/api/update'), { cache: 'no-store' }).then(r => r.json());
      if (s.to) target = s.to;
      lastStep = s.step || lastStep;
      if (s.done) {
        if (s.err) { UPD[name] = { cls: 'fail', text: 'FAILED: ' + s.err }; refresh(); return false; }
        if (/already up to date/.test(lastStep)) { UPD[name] = { cls: 'ok', text: '✓ ' + lastStep }; refresh(); return true; }
      }
      UPD[name] = { busy: true, cls: 'run', text: (s.from && s.to ? `${s.from} → ${s.to}: ` : '') + lastStep };
    } catch (e) {
      // The launcher is restarting: wait for it to answer on the new build.
      UPD[name] = { busy: true, cls: 'run', text: 'launcher restarting…' };
    }
    if (target) {
      try {
        const v = await fetch(rigApi(name, self, '/api/version'), { cache: 'no-store' }).then(r => r.json());
        if (v.short === target) {
          const s = await fetch(rigApi(name, self, '/api/update'), { cache: 'no-store' }).then(r => r.json()).catch(() => ({}));
          if (!s.running) { UPD[name] = { cls: 'ok', text: `✓ updated to ${target} — launcher back up` }; refresh(); return true; }
        }
      } catch (e) { /* still restarting */ }
    }
    refresh();
  }
  UPD[name] = { cls: 'fail', text: 'no answer after 10 minutes — check the rig' };
  refresh();
  return false;
}

async function updateAll() {
  const rigs = LAST_RIGS.filter(r => r.launcherUp);
  if (!rigs.length || !confirm(`Update ${rigs.length} rig(s) one at a time?

Each restarts its running theatre (about 30 s off the air) and its launcher. Stops at the first failure.`)) return;
  document.getElementById('updAll').disabled = true;
  for (const r of rigs) {
    if (!(await updateRig(r.name, r.self, true))) break;
  }
  document.getElementById('updAll').disabled = false;
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
